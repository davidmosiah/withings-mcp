name: mcp-scorecard
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Build the reviewed SQLite native dependency
        run: |
          node_root="$(dirname "$(dirname "$(command -v node)")")"
          node_gyp="$(npm root -g)/npm/node_modules/node-gyp/bin/node-gyp.js"
          cd node_modules/better-sqlite3
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" USERPROFILE="$RUNNER_TEMP" node "$node_gyp" rebuild --release --nodedir="$node_root"
      - name: Test with a clean environment
        run: |
          mkdir -p "$RUNNER_TEMP/withings-test-home"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/withings-test-home" USERPROFILE="$RUNNER_TEMP/withings-test-home" npm test
      - name: Run the scorecard with a clean environment
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/withings-test-home" USERPROFILE="$RUNNER_TEMP/withings-test-home" npm_config_ignore_scripts=true npx -y mcp-scorecard@0.5.4 . --min-score 90

